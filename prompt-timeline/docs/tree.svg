<text x="932" y="346" class="d" text-anchor="start">its turns, or no reply if it</text>
<text x="932" y="364" class="d" text-anchor="start">never got one</text>
<path d="M918 322h8" class="lead"/>
<path d="M560 652V622H722V588" class="lead" marker-end="url(#tip)"/>
