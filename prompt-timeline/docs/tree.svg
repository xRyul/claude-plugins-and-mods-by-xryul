<text x="380" y="714" class="m" fill="#b1b9f9">◇</text>
<text x="396" y="714" class="d">another tool</text>
<text x="492.4" y="714" class="m" fill="#ffc107">●</text>
<text x="508.4" y="714" class="d">committed</text>
<text x="583.1999999999999" y="714" class="m" fill="#ffc107">⇡</text>
<text x="599.1999999999999" y="714" class="d">pushed</text>
<text x="380" y="734" class="d">or just a reply</text>
<path d="M798.5 652V588" class="lead" marker-end="url(#tip)"/>
<text x="700" y="672" class="t" text-anchor="start">Context in use</text>
<text x="700" y="691" class="d" text-anchor="start">when it was answered</text>
<rect x="700" y="704" width="200" height="9" rx="4.5" fill="url(#ctx)"/>
<text x="700" y="732" class="d" font-size="12" text-anchor="start" fill="#999999">0%</text>
<text x="760" y="732" class="d" font-size="12" text-anchor="middle" fill="#ffff00">30%</text>
<text x="800" y="732" class="d" font-size="12" text-anchor="middle" fill="#ff8c00">50%</text>
<text x="900" y="732" class="d" font-size="12" text-anchor="end" fill="#ff0000">100%</text>
<path d="M980 652V622H857V588" class="lead" marker-end="url(#tip)"/>
<text x="940" y="672" class="t" text-anchor="start">When you sent it</text>
