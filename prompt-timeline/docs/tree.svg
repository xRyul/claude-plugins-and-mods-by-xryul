<text x="352" y="368" class="m" fill="#e6e6e6">add tests for the toggle</text>
<text x="758" y="368" class="m" text-anchor="end" fill="#4eba65">✎ 1 file</text>
<text x="812" y="368" class="m" text-anchor="end" fill="#fcfc05">29%</text>
<text x="884" y="368" class="m" text-anchor="end" fill="#8a8a8a">10:03</text>
<circle cx="320.5" cy="389" r="4" fill="#d77757"/>
