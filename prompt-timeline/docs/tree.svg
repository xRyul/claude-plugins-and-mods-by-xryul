<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">prompt-timeline's tree view</title>
<desc id="desc">The timeline pane on its tree: each prompt a numbered dot on its branch's line, then what its turn did, the context in use and when it was sent, with each part labelled.</desc>
<style>
.m{font-family:'JetBrains Mono','SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:15px}
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#ededf2}
.d{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#9ea2b5}
.lead{fill:none;stroke:#b9bdcc;stroke-width:1.3}
</style>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#b9bdcc"/></marker>
<linearGradient id="ctx"><stop offset="0%" stop-color="#999999"/><stop offset="30%" stop-color="#ffff00"/><stop offset="50%" stop-color="#ff8c00"/><stop offset="100%" stop-color="#ff0000"/></linearGradient>
</defs>
<rect width="1200" height="770" rx="14" fill="#1b1c22"/>
<rect x="300" y="100" width="600" height="500" rx="10" fill="#262626" stroke="#3d3f4c"/>
<text x="316" y="132" class="m" fill="#d77757">◆</text>
<text x="334" y="132" class="m" font-weight="700" fill="#e6e6e6">Timeline</text>
<rect x="424" y="116" width="54" height="22" fill="#3a3c48"/>
<text x="451" y="132" class="m" text-anchor="middle" fill="#8a8a8a">list</text>
<rect x="478" y="116" width="54" height="22" fill="#d77757"/>
<text x="505" y="132" class="m" text-anchor="middle" font-weight="700" fill="#1c1c1c">tree</text>
<text x="550" y="132" class="m" fill="#d77757">● ctx</text>
<text x="613" y="132" class="m" fill="#8a8a8a">○ find</text>
<text x="884" y="132" class="m" text-anchor="end" fill="#8a8a8a">12 turns · 2 branches</text>
<line x1="300" y1="150" x2="900" y2="150" stroke="#4a4a4a"/>
<circle cx="320.5" cy="181" r="4" fill="#d77757"/>
<text x="334" y="186" class="m" fill="#8a8a8a">1</text>
<text x="352" y="186" class="m" fill="#e6e6e6">set up the project and run the…</text>
<text x="758" y="186" class="m" text-anchor="end" fill="#8a8a8a">› 6 cmds</text>
<text x="812" y="186" class="m" text-anchor="end" fill="#a7a785">4%</text>
<text x="884" y="186" class="m" text-anchor="end" fill="#8a8a8a">09:12</text>
<circle cx="320.5" cy="207" r="4" fill="#d77757"/>
<text x="334" y="212" class="m" fill="#8a8a8a">2</text>
<text x="352" y="212" class="m" fill="#e6e6e6">add a dark mode toggle to setti…</text>
<text x="758" y="212" class="m" text-anchor="end" fill="#4eba65">✎ 3 files</text>
<text x="812" y="212" class="m" text-anchor="end" fill="#b8b86b">9%</text>
<text x="884" y="212" class="m" text-anchor="end" fill="#8a8a8a">09:20</text>
<circle cx="320.5" cy="233" r="4" fill="#d77757"/>
<text x="334" y="238" class="m" fill="#8a8a8a">3</text>
<text x="352" y="238" class="m" fill="#e6e6e6">the toggle resets on reload</text>
<text x="758" y="238" class="m" text-anchor="end" fill="#8a8a8a">› 2 cmds</text>
<text x="812" y="238" class="m" text-anchor="end" fill="#c9c952">14%</text>
<text x="884" y="238" class="m" text-anchor="end" fill="#8a8a8a">09:31</text>
<path d="M320.5 246V298" stroke="#d77757" stroke-width="1.6" fill="none"/>
<path d="M320.5 259H333.5Q338.5 259 338.5 264V270" stroke="#4fa597" stroke-width="1.6" fill="none"/>
<circle cx="338.5" cy="285" r="3.8" fill="none" stroke="#4fa597" stroke-width="1.5"/>
