<text x="352" y="316" class="m" fill="#e6e6e6">keep it in localStorage</text>
<text x="758" y="316" class="m" text-anchor="end" fill="#4eba65">✎ 2 files</text>
<text x="812" y="316" class="m" text-anchor="end" fill="#d6d63d">18%</text>
<text x="884" y="316" class="m" text-anchor="end" fill="#8a8a8a">09:40</text>
<circle cx="320.5" cy="337" r="4" fill="#d77757"/>
<text x="334" y="342" class="m" fill="#8a8a8a">5</text>
<text x="352" y="342" class="m" fill="#e6e6e6">▣ the colours look off here</text>
<text x="758" y="342" class="m" text-anchor="end" fill="#4eba65">✎ 4 files</text>
<text x="812" y="342" class="m" text-anchor="end" fill="#ebeb1f">24%</text>
<text x="884" y="342" class="m" text-anchor="end" fill="#8a8a8a">09:52</text>
<circle cx="320.5" cy="363" r="4" fill="#d77757"/>
