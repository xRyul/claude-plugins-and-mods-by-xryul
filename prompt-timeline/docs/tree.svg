<text x="758" y="576" class="m" text-anchor="end" fill="#ffc107">⇡ pushed</text>
<text x="812" y="576" class="m" text-anchor="end" fill="#ff3500">81%</text>
<text x="884" y="576" class="m" text-anchor="end" fill="#d77757" font-weight="700">◂ here</text>
<text x="440" y="40" class="t" text-anchor="middle">list · tree</text>
<text x="440" y="59" class="d" text-anchor="middle">switch the view</text>
