<path d="M320.5 415H333.5Q338.5 415 338.5 420V426" stroke="#e35ea9" stroke-width="1.6" fill="none"/>
<circle cx="338.5" cy="441" r="3.8" fill="none" stroke="#e35ea9" stroke-width="1.5"/>
