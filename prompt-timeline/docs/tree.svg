<text x="812" y="550" class="m" text-anchor="end" fill="#ff4e00">72%</text>
<text x="884" y="550" class="m" text-anchor="end" fill="#8a8a8a">10:52</text>
<rect x="306" y="558" width="588" height="26" rx="3" fill="#393b47"/>
