<text x="590" y="40" class="t" text-anchor="middle">ctx</text>
<text x="590" y="59" class="d" text-anchor="middle">show or hide context use</text>
<path d="M572.5 66V112" class="lead" marker-end="url(#tip)"/>
<text x="760" y="40" class="t" text-anchor="middle">find</text>
<text x="760" y="59" class="d" text-anchor="middle">search every prompt</text>
<path d="M745 66L646 112" class="lead" marker-end="url(#tip)"/>
<text x="930" y="126" class="t" text-anchor="start">turns to here · branches</text>
<text x="930" y="145" class="d" text-anchor="start">beside them</text>
<path d="M922 121H892" class="lead" marker-end="url(#tip)"/>
<text x="272" y="186" class="t" text-anchor="end">● your conversation</text>
<text x="272" y="205" class="d" text-anchor="end">each prompt on the line you’re on</text>
<path d="M280 181H312.5" class="lead" marker-end="url(#tip)"/>
<text x="272" y="233" class="t" text-anchor="end">A rewind left a branch</text>
<text x="272" y="252" class="d" text-anchor="end">each branch has its own colour</text>
<path d="M280 228L328.5 256" class="lead" marker-end="url(#tip)"/>
<text x="272" y="290" class="t" text-anchor="end">○ a prompt on that branch</text>
<text x="272" y="309" class="d" text-anchor="end">click it to read its last reply</text>
<text x="272" y="327" class="d" text-anchor="end">and continue from it</text>
<path d="M280 285H330.5" class="lead" marker-end="url(#tip)"/>
<text x="272" y="356" class="t" text-anchor="end">▣ a pasted image</text>
<path d="M280 351L353 346" class="lead" marker-end="url(#tip)"/>
<text x="272" y="386" class="t" text-anchor="end">Turn number</text>
<text x="272" y="405" class="d" text-anchor="end">a branch shares it with the</text>
<text x="272" y="423" class="d" text-anchor="end">turn that replaced it</text>
<path d="M280 381L334 372" class="lead" marker-end="url(#tip)"/>
<text x="272" y="516" class="t" text-anchor="end">Click a prompt</text>
<text x="272" y="535" class="d" text-anchor="end">to scroll the transcript to it</text>
<path d="M280 511L353 502" class="lead" marker-end="url(#tip)"/>
<text x="272" y="576" class="t" text-anchor="end">◉ where the conversation is</text>
<text x="272" y="595" class="d" text-anchor="end">its row is lit</text>
<path d="M280 571H311.5" class="lead" marker-end="url(#tip)"/>
<path d="M918 259V415" class="lead"/>
<path d="M918 259H722V274" class="lead" marker-end="url(#tip)"/>
<path d="M918 415H731V430" class="lead" marker-end="url(#tip)"/>
