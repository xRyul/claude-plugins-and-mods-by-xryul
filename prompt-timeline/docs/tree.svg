<text x="370" y="446" class="m" fill="#e6e6e6">try CSS variables instead</text>
<text x="758" y="446" class="m" text-anchor="end" fill="#e35ea9">1 turn</text>
<text x="812" y="446" class="m" text-anchor="end" fill="#ffd100">38%</text>
<text x="884" y="446" class="m" text-anchor="end" fill="#8a8a8a">10:18</text>
<circle cx="320.5" cy="467" r="4" fill="#d77757"/>
<text x="334" y="472" class="m" fill="#8a8a8a">8</text>
<text x="352" y="472" class="m" fill="#e6e6e6">why this approach?</text>
<text x="758" y="472" class="m" text-anchor="end" fill="#8a8a8a">reply</text>
<text x="812" y="472" class="m" text-anchor="end" fill="#ffd100">38%</text>
<text x="884" y="472" class="m" text-anchor="end" fill="#8a8a8a">10:21</text>
<circle cx="320.5" cy="493" r="4" fill="#d77757"/>
<text x="334" y="498" class="m" fill="#8a8a8a">9</text>
<text x="352" y="498" class="m" fill="#e6e6e6">the build got slower, why?</text>
<text x="758" y="498" class="m" text-anchor="end" fill="#8a8a8a">› 5 cmds</text>
<text x="812" y="498" class="m" text-anchor="end" fill="#ffa300">46%</text>
<text x="884" y="498" class="m" text-anchor="end" fill="#8a8a8a">10:34</text>
<circle cx="320.5" cy="519" r="4" fill="#d77757"/>
<text x="334" y="524" class="m" fill="#8a8a8a">10</text>
<text x="361" y="524" class="m" fill="#e6e6e6">fix it</text>
<text x="758" y="524" class="m" text-anchor="end" fill="#4eba65">✎ 2 files</text>
<text x="812" y="524" class="m" text-anchor="end" fill="#ff6d00">61%</text>
<text x="884" y="524" class="m" text-anchor="end" fill="#8a8a8a">10:48</text>
<circle cx="320.5" cy="545" r="4" fill="#d77757"/>
