<text x="370" y="290" class="m" fill="#e6e6e6">keep it in a cookie instead</text>
<text x="758" y="290" class="m" text-anchor="end" fill="#4fa597">no reply</text>
<text x="812" y="290" class="m" text-anchor="end" fill="#d6d63d">18%</text>
<text x="884" y="290" class="m" text-anchor="end" fill="#8a8a8a">09:38</text>
<circle cx="320.5" cy="311" r="4" fill="#d77757"/>
