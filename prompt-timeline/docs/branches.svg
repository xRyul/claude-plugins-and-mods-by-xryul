<path d="M326.5 828V876" stroke="#e35ea9" stroke-width="1.6" fill="none"/>
<circle cx="290.5" cy="648" r="4" fill="#d77757"/>
<text x="304" y="653" class="m" fill="#8a8a8a">1</text>
<text x="322" y="653" class="m" fill="#e6e6e6">add a settings page</text>
<path d="M290.5 672H295" stroke="#d77757" stroke-width="1.6" fill="none"/>
<path d="M295 672H303.5Q308.5 672 308.5 677V684" stroke="#d77757" stroke-width="1.6" fill="none"/>
