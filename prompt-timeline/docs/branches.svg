<text x="340" y="701" class="m" fill="#e6e6e6">put it in a modal</text>
<circle cx="308.5" cy="720" r="4" fill="#d77757"/>
<text x="322" y="725" class="m" fill="#8a8a8a">3</text>
<text x="340" y="725" class="m" fill="#e6e6e6">add a theme picker</text>
<path d="M308.5 744H313" stroke="#d77757" stroke-width="1.6" fill="none"/>
<path d="M313 744H321.5Q326.5 744 326.5 749V756" stroke="#d77757" stroke-width="1.6" fill="none"/>
<circle cx="326.5" cy="768" r="4" fill="#d77757"/>
<text x="340" y="773" class="m" fill="#8a8a8a">4</text>
<text x="358" y="773" class="m" fill="#e6e6e6">use a dropdown</text>
<circle cx="326.5" cy="792" r="4" fill="#d77757"/>
<text x="340" y="797" class="m" fill="#8a8a8a">5</text>
<text x="358" y="797" class="m" fill="#e6e6e6">preview each theme</text>
<path d="M326.5 816H331" stroke="#d77757" stroke-width="1.6" fill="none"/>
<path d="M331 816H339.5Q344.5 816 344.5 821V828" stroke="#d77757" stroke-width="1.6" fill="none"/>
<circle cx="344.5" cy="840" r="4" fill="#d77757"/>
<text x="358" y="845" class="m" fill="#8a8a8a">6</text>
<text x="376" y="845" class="m" fill="#e6e6e6">preview on hover</text>
<circle cx="344.5" cy="864" r="5" fill="none" stroke="#d77757" stroke-width="1.5"/>
<circle cx="344.5" cy="864" r="2.2" fill="#d77757"/>
<text x="358" y="869" class="m" fill="#e6e6e6" font-weight="700">7</text>
<text x="376" y="869" class="m" fill="#e6e6e6" font-weight="700">make it subtle</text>
<circle cx="326.5" cy="888" r="3.8" fill="none" stroke="#e35ea9" stroke-width="1.5"/>
<text x="340" y="893" class="m" fill="#e35ea9">6</text>
<text x="358" y="893" class="m" fill="#e6e6e6">save it per device</text>
<circle cx="308.5" cy="912" r="3.8" fill="none" stroke="#4fa597" stroke-width="1.5"/>
<text x="322" y="917" class="m" fill="#4fa597">4</text>
<text x="340" y="917" class="m" fill="#e6e6e6">use radio buttons</text>
<circle cx="290.5" cy="936" r="3.8" fill="none" stroke="#a98bf0" stroke-width="1.5"/>
<text x="304" y="941" class="m" fill="#a98bf0">2</text>
<text x="322" y="941" class="m" fill="#e6e6e6">make it a full page</text>
<circle cx="290.5" cy="960" r="3.8" fill="none" stroke="#a98bf0" stroke-width="1.5"/>
<text x="304" y="965" class="m" fill="#a98bf0">3</text>
<text x="322" y="965" class="m" fill="#e6e6e6">ship it</text>
<text x="700" y="869" class="t" text-anchor="start">◉ Now you’re here</text>
<text x="700" y="888" class="d" text-anchor="start">your next prompt carries on</text>
<text x="700" y="906" class="d" text-anchor="start">from this turn</text>
<path d="M692 864H510" class="lead" marker-end="url(#tip)"/>
<path d="M684 672V816" class="lead"/>
<path d="M684 672H318.5" class="lead" marker-end="url(#tip)"/>
<path d="M684 744H336.5" class="lead" marker-end="url(#tip)"/>
<path d="M684 816H354.5" class="lead" marker-end="url(#tip)"/>
<path d="M684 744h10" class="lead"/>
<text x="700" y="749" class="t" text-anchor="start">The accent line follows you</text>
<text x="700" y="768" class="d" text-anchor="start">from the first prompt to ◉,</text>
<text x="700" y="786" class="d" text-anchor="start">through each branch on the way</text>
<text x="250" y="941" class="t" text-anchor="end">The line you left is a branch</text>
<text x="250" y="960" class="d" text-anchor="end">in a colour of its own, kept whole:</text>
<text x="250" y="978" class="d" text-anchor="end">click it to go back the same way</text>
<path d="M258 936H282.5" class="lead" marker-end="url(#tip)"/>
